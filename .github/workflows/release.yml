# Publishes a release of the Better Stack Pulumi provider. This file runs in the vendor repository
# BetterStackHQ/pulumi-betterstack, never in unified-api: unified-api's pulumi-release workflow
# exports this tree there with its SDKs already generated for the version, then pushes the vX.Y.Z
# tag (and sdk/go/vX.Y.Z for the Go module). What is tagged is exactly what is published.
#
# Repository secret: NPM_TOKEN (publish rights on @better_stack/pulumi). PyPI and NuGet need none:
# pulumi_betterstack on PyPI and the better_stack account on NuGet.org trust this repository's
# release.yml as their Trusted Publisher, and the job proves who it is with a GitHub OIDC token.
# Maven Central has no trusted publishing, so the Java job runs in the "maven-central" environment
# (v* tags only) and reads:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  a Central Portal user token
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE                  the ASCII-armored signing key and its passphrase
#
# A tag whose binaries are on its release but whose packages didn't all publish is finished by a
# dispatch with that tag: it publishes npm, PyPI and NuGet from the tag's tree and skips what a
# registry already has, and with java=true it also publishes the Java package. Run the dispatch on
# main, so it uses this workflow file, and the package contents still come from the tag. Since
# maven-central admits only v* tags, a java=true dispatch needs main added to its deployment refs
# for that run, and taken out again after.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing vX.Y.Z tag whose release has its binaries: publish the packages that are missing"
        type: string
        required: true
      java:
        description: "Also publish the Java package to Maven Central (waits for the maven-central approval)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROVIDER: betterstack

jobs:
  check:
    if: github.repository == 'BetterStackHQ/pulumi-betterstack'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: The dispatched tag is a release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad tag $TAG"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: The tag matches the version the SDKs were generated with
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          test "$(jq -r .version provider/cmd/pulumi-resource-betterstack/schema.json)" = "$version"
          test "$(jq -r .version sdk/nodejs/package.json)" = "$version"
          grep -qx "VERSION = \"$version\"" sdk/python/setup.py
          test "$(cat sdk/dotnet/version.txt)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
      # A dispatch builds no binaries, so it publishes only next to the ones the tag's run attached.
      - name: The tag's release has its binaries
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            grep -qx "pulumi-resource-${PROVIDER}-v${VERSION}-${target}.tar.gz" <<<"$assets" || { echo "::error::$TAG's release lacks the $target binary"; exit 1; }
          done

  provider:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build provider binaries
        run: |
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            dir="dist/pulumi-resource-${PROVIDER}-v${VERSION}-${target}"
            GOOS="${target%-*}" GOARCH="${target#*-}" CGO_ENABLED=0 \
              go build -C provider -ldflags "-X github.com/betterstackhq/pulumi-betterstack/provider.Version=${VERSION}" \
              -o "../${dir}/pulumi-resource-${PROVIDER}$([ "${target%-*}" = windows ] && echo .exe)" \
              "./cmd/pulumi-resource-${PROVIDER}"
            cp LICENSE README.md "$dir/"
            tar -czf "${dir}.tar.gz" -C "$dir" .
          done
          (cd dist && sha256sum ./*.tar.gz > "pulumi-${PROVIDER}_${VERSION}_checksums.txt")
      - name: Attach binaries to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*_checksums.txt

  publish_sdks:
    # After the binaries: a package must never point at a plugin version that can't be downloaded.
    needs: [check, provider]
    # A dispatch skips provider: publish when check passed and provider passed or didn't run.
    if: ${{ !cancelled() && needs.check.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.provider.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI and NuGet Trusted Publishing
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build and check the packages
        run: |
          python3 -m pip install build twine
          REQUIRE_ALL=1 release/package_sdks.sh dist
          python3 -m twine check dist/*.whl dist/*.tar.gz
      # The ./ matters: npm reads a bare dist/name.tgz as the GitHub repository dist/name.tgz.
      - name: Publish the npm package
        run: |
          if npm view "@better_stack/pulumi@$VERSION" version >/dev/null 2>&1; then
            echo "@better_stack/pulumi@$VERSION is already on npm"
          else
            npm publish ./dist/*.tgz --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The publish action uploads every file in its directory, so the Python files get their own.
      - name: Separate the Python packages
        run: mkdir pydist && mv dist/*.whl dist/*.tar.gz pydist/
      - name: Publish the Python package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pydist/
          skip-existing: true
      # Trades the job's OIDC token for a short-lived key of the better_stack account on NuGet.org.
      - name: Sign in to NuGet.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: better_stack
      - name: Publish the .NET package
        # Not --skip-duplicate: it reads every 409 as "already exists", a reserved package ID too.
        run: |
          id="$(basename dist/*.nupkg ".$VERSION.nupkg")"
          if curl -fsS "https://api.nuget.org/v3-flatcontainer/${id,,}/index.json" | jq -e --arg v "$VERSION" '.versions | index($v)' >/dev/null; then
            echo "$id $VERSION is already on NuGet"
          else
            dotnet nuget push dist/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
          fi
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}

  publish_java:
    # After the binaries, like the other SDKs: the jar's plugin.json points at this release's plugin.
    needs: [check, provider]
    if: ${{ !cancelled() && needs.check.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.provider.result) && (github.event_name == 'push' || inputs.java) }}
    runs-on: ubuntu-latest
    environment: maven-central
    timeout-minutes: 60
    env:
      PACKAGE_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}
          persist-credentials: false
      # pulumi-java leaves the POM's name and developer empty for a package not published by
      # Pulumi, and Maven Central rejects a POM without them ("Project name is missing").
      - name: Name the project and its developer in the POM
        run: |
          f=sdk/java/build.gradle
          sed -i \
            -e 's/^\(                inceptionYear = \)""$/\1"2026"/' \
            -e 's/^\(                name = \)""$/\1"pulumi-betterstack"/' \
            -e 's/^\(                        id = \)""$/\1"betterstack"/' \
            -e 's/^\(                        name = \)""$/\1"Better Stack"/' \
            -e 's/^\(                        email = \)""$/\1"hello@betterstack.com"/' "$f"
          ! grep -nE '^ *(inceptionYear|name|id|email) = ""$' "$f" || { echo "::error::$f still has an empty POM field"; exit 1; }
      # The generated build compiles with a Java 11 toolchain; Gradle itself runs on 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-disabled: true
      # The generated build uploads through the Central Portal's OSSRH staging API with the Portal
      # user token and signs with the in-memory key. Closing the staging repository hands it to the
      # Portal as a deployment, which validates it and stops at VALIDATED. The step then publishes
      # that deployment itself and waits until the version is on Maven Central, so no release waits
      # on a person, and fails with the Portal's errors otherwise. A rerun publishes a deployment of
      # this version that is still live instead of uploading it again.
      - name: Publish the Java package to Maven Central
        env:
          PUBLISH_REPO_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PUBLISH_REPO_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "$PUBLISH_REPO_USERNAME" -a -n "$SIGNING_KEY" || { echo "::error::the maven-central environment lacks its secrets"; exit 1; }
          pom="https://repo1.maven.org/maven2/com/betterstack/pulumi/$PACKAGE_VERSION/pulumi-$PACKAGE_VERSION.pom"
          purl="pkg:maven/com.betterstack/pulumi@$PACKAGE_VERSION"
          auth="Authorization: Bearer $(printf '%s:%s' "$PUBLISH_REPO_USERNAME" "$PUBLISH_REPO_PASSWORD" | base64 -w0)"
          portal=https://central.sonatype.com/api/v1/publisher
          on_central() { curl -fsS -o /dev/null "$pom" 2>/dev/null; }
          status() { curl -fsS -X POST -H "$auth" "$portal/status?id=$1"; }
          # Prints "<staging key> <deployment id>" for each staging repository of the namespace.
          repositories() {
            curl -fsS -H "$auth" "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=com.betterstack" \
              | jq -r '.repositories[] | select(.portal_deployment_id) | "\(.key) \(.portal_deployment_id)"'
          }
          if on_central; then echo "com.betterstack:pulumi:$PACKAGE_VERSION is already on Maven Central"; exit 0; fi
          id=""
          while read -r key dep; do
            line="$(status "$dep" | jq -r '"\(.deploymentState) \(.purls // [] | join(","))"')"
            echo "Portal deployment $dep ($key): $line"
            case "$line" in *FAILED*) ;; *"$purl"*) id="$dep" ;; esac
          done < <(repositories)
          if [ -z "$id" ]; then
            gradle -p sdk/java --no-daemon -Porg.gradle.java.installations.paths="$JAVA_HOME_11_X64" \
              publishToSonatype closeSonatypeStagingRepository | tee "$RUNNER_TEMP/gradle.log"
            key="$(grep -o "Created staging repository '[^']*'" "$RUNNER_TEMP/gradle.log" | cut -d"'" -f2)"
            id="$(repositories | awk -v k="$key" '$1 == k {print $2}')"
            test -n "$id" || { echo "::error::the Central Portal has no deployment for staging repository $key"; exit 1; }
          fi
          for _ in $(seq 100); do
            state="$(status "$id" | jq -r .deploymentState)" || state=unknown
            echo "Portal deployment $id: $state"
            case "$state" in
              PUBLISHED) on_central && exit 0 ;;
              VALIDATED) curl -fsS -X POST -H "$auth" "$portal/deployment/$id" ;;
              FAILED)
                echo "::error::the Central Portal failed deployment $id of com.betterstack:pulumi:$PACKAGE_VERSION"
                status "$id" | jq .errors
                exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::com.betterstack:pulumi:$PACKAGE_VERSION is not on Maven Central 50 minutes after its upload (Portal state: $state)"
          exit 1
